name: gui-probe
on:
  push:
    branches: [gui-probe]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the fix (after variant only)
        if: matrix.variant == 'after'
        shell: bash
        run: git apply --verbose .github/probe-fix.patch
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: cmd
        run: build.bat
      - name: GUI smoke script (must fail before the fix, pass after)
        shell: pwsh
        run: ./tools/gui_smoke.ps1 build\ddr5ramtest.exe
