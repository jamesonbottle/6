name: gui-probe
on:
  push:
    branches: [gui-probe]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the fix (after variant only)
        if: matrix.variant == 'after'
        shell: bash
        run: git apply --verbose .github/probe-fix.patch
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: cmd
        run: build.bat
      - name: Start the GUI, dump its windows, take screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System; using System.Text; using System.Runtime.InteropServices; using System.Collections.Generic;
          public class W {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string c, string t);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr p, EnumProc f, IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern int GetDlgCtrlID(IntPtr h);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr dc, uint flags);
            [DllImport("user32.dll")] public static extern uint GetDpiForWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            public static List<string> TopLevel(uint pid) {
              var rows = new List<string>();
              EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p); if (p != pid) return true;
                var c = new StringBuilder(64); GetClassName(h, c, 64); var t = new StringBuilder(80); GetWindowText(h, t, 80);
                RECT r; GetWindowRect(h, out r);
                rows.Add(string.Format("hwnd={0} vis={1} {2,-24} [{3},{4} {5}x{6}] '{7}'", h, IsWindowVisible(h) ? 1 : 0, c, r.L, r.T, r.R - r.L, r.B - r.T, t)); return true; }, IntPtr.Zero);
              return rows; }
            public static IntPtr ChildByText(IntPtr parent, string text) {
              IntPtr found = IntPtr.Zero;
              EnumChildWindows(parent, (h, l) => { var t = new StringBuilder(80); GetWindowText(h, t, 80); if (t.ToString() == text) { found = h; return false; } return true; }, IntPtr.Zero);
              return found; }
            public static List<string> Dump(IntPtr parent) {
              var rows = new List<string>(); int z = 0;
              EnumChildWindows(parent, (h, l) => {
                var c = new StringBuilder(64); GetClassName(h, c, 64);
                var t = new StringBuilder(80); GetWindowText(h, t, 80);
                RECT r; GetWindowRect(h, out r);
                rows.Add(string.Format("z={0,2} id={1,4} vis={2} {3,-16} [{4},{5} {6}x{7}] '{8}'", z++, GetDlgCtrlID(h), IsWindowVisible(h) ? 1 : 0, c, r.L, r.T, r.R - r.L, r.B - r.T, t.ToString().Replace("\n", " ")));
                return true; }, IntPtr.Zero);
              return rows; }
          }
          "@
          $exe = Join-Path $PWD "build\ddr5ramtest.exe"
          $p = Start-Process $exe -PassThru
          $h = [IntPtr]::Zero
          for ($i = 0; $i -lt 40 -and $h -eq [IntPtr]::Zero; $i++) { Start-Sleep -Milliseconds 500; $h = [W]::FindWindow("Ddr5RamTestWindow", [NullString]::Value) }
          Start-Sleep -Seconds 2
          "--- top-level windows of pid $($p.Id) ---" | Tee-Object probe.txt
          [W]::TopLevel([uint32]$p.Id) | Tee-Object probe.txt -Append
          $full = New-Object System.Drawing.Bitmap 1024, 768
          $gf = [System.Drawing.Graphics]::FromImage($full); $gf.CopyFromScreen(0, 0, 0, 0, $full.Size); $gf.Dispose(); $full.Save("screen_full.png"); $full.Dispose()
          if ($h -eq [IntPtr]::Zero) { "no main window after 20 s; alive: $(-not $p.HasExited)" | Tee-Object probe.txt -Append; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; exit 0 }
          "main window handle: $h  alive: $(-not $p.HasExited)  dpi: $([W]::GetDpiForWindow($h))" | Tee-Object probe.txt -Append
          $r = New-Object W+RECT; [void][W]::GetWindowRect($h, [ref]$r)
          "main rect: $($r.L),$($r.T) $($r.R - $r.L)x$($r.B - $r.T)" | Tee-Object probe.txt -Append
          "--- children, z-order from TOP to bottom ---" | Tee-Object probe.txt -Append
          [W]::Dump($h) | Tee-Object probe.txt -Append
          $w = $r.R - $r.L; $hh = $r.B - $r.T
          $bmp = New-Object System.Drawing.Bitmap $w, $hh
          $g = [System.Drawing.Graphics]::FromImage($bmp); $dc = $g.GetHdc()
          [void][W]::PrintWindow($h, $dc, 2); $g.ReleaseHdc($dc); $g.Dispose()
          $bmp.Save("printwindow.png"); $bmp.Dispose()
          $bmp2 = New-Object System.Drawing.Bitmap $w, $hh
          $g2 = [System.Drawing.Graphics]::FromImage($bmp2)
          $g2.CopyFromScreen($r.L, $r.T, 0, 0, $bmp2.Size); $g2.Dispose()
          $bmp2.Save("screen.png"); $bmp2.Dispose()
          function DarkPixels($bitmap, $ox, $oy, $child) {
            $cr = New-Object W+RECT; [void][W]::GetWindowRect($child, [ref]$cr)
            $n = 0
            for ($x = $cr.L - $ox; $x -lt $cr.R - $ox; $x++) { for ($y = $cr.T - $oy; $y -lt $cr.B - $oy; $y++) {
              if ($x -ge 0 -and $y -ge 0 -and $x -lt $bitmap.Width -and $y -lt $bitmap.Height) {
                $c = $bitmap.GetPixel($x, $y); if (($c.R + $c.G + $c.B) / 3 -lt 110) { $n++ } } } }
            return $n }
          "--- visible text check (dark pixels where a label's text must be; 0 = nothing drawn there) ---" | Tee-Object probe.txt -Append
          foreach ($txt in @("Total memory:", "Duration:", "Pages verified:")) {
            $c = [W]::ChildByText($h, $txt)
            $bs = [System.Drawing.Bitmap]::FromFile((Join-Path $PWD "screen.png"))
            $bp = [System.Drawing.Bitmap]::FromFile((Join-Path $PWD "printwindow.png"))
            "$txt  real screen: $(DarkPixels $bs $r.L $r.T $c)   PrintWindow: $(DarkPixels $bp $r.L $r.T $c)" | Tee-Object probe.txt -Append
            $bs.Dispose(); $bp.Dispose() }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-probe-${{ matrix.variant }}
          path: |
            probe.txt
            printwindow.png
            screen.png
            screen_full.png
